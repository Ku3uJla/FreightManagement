# ==============================================================================
# Freight Management — Nginx Reverse Proxy Configuration
# ==============================================================================
# Проксирует HTTP-запросы к микросервисам через Docker-сеть `backend`.
# Nginx-контейнер должен быть подключён к сети `backend` в docker-compose.
#
# Имена сервисов (из docker-compose.yml):
#   auth-app:8083      → auth-service       (аутентификация, JWT)
#   user-app:8080      → user-service       (профили пользователей)
#   order-app:8082     → order-service      (заказы)
#   resource-app:8081  → resource-service   (водители, автомобили)
#
# notification-app не имеет HTTP/gRPC — работает как RabbitMQ consumer.
# ==============================================================================


# ------------------------------------------------------------------------------
# Upstream блоки
# Для горизонтального масштабирования добавьте дополнительные `server` строки:
#   server auth-app-2:8083;
# ------------------------------------------------------------------------------

upstream auth_service {
    server auth-app:8083;
}

upstream user_service {
    server user-app:8080;
}

upstream order_service {
    server order-app:8082;
}

upstream resource_service {
    server resource-app:8081;
}


# ------------------------------------------------------------------------------
# Основной сервер
# ------------------------------------------------------------------------------

server {
    listen 80;
    server_name localhost;

    # Максимальный размер тела запроса
    client_max_body_size 10m;

    # Стандартные proxy-заголовки
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep-alive к upstream
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Таймауты
    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;


    # --------------------------------------------------------------------------
    # Статические файлы
    # --------------------------------------------------------------------------

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }


    # --------------------------------------------------------------------------
    # Health Check — auth-service (GET / → {"message": "auth-service"})
    # --------------------------------------------------------------------------

    location = / {
        proxy_pass http://auth_service;
    }


    # --------------------------------------------------------------------------
    # Auth Service (auth-app:8083)
    #   POST /auth/register  — регистрация нового пользователя
    #   POST /auth/login     — вход, выдача JWT в cookie (HttpOnly, 1ч)
    # --------------------------------------------------------------------------

    location /auth {
        proxy_pass http://auth_service;
    }


    # --------------------------------------------------------------------------
    # User Service (user-app:8080)
    #   GET  /user/:id        — профиль пользователя по ID
    #   PUT  /user/:id/role   — обновление роли пользователя
    # --------------------------------------------------------------------------

    location /user {
        proxy_pass http://user_service;
    }


    # --------------------------------------------------------------------------
    # Order Service (order-app:8082)
    #   POST   /orders              — создание заказа
    #   GET    /orders              — список заказов (фильтрация + пагинация)
    #   GET    /orders/:id          — заказ по ID
    #   PUT    /orders/:id          — обновление заказа
    #   PATCH  /orders/:id/status   — обновление статуса
    #   POST   /orders/:id/manager  — назначение менеджера
    #   GET    /users/:user_id/orders     — заказы пользователя
    #   GET    /drivers/:driver_id/orders — заказы водителя
    # --------------------------------------------------------------------------

    location /orders {
        proxy_pass http://order_service;
    }

    # /users/:user_id/orders → order-service
    location ~ ^/users/[^/]+/orders$ {
        proxy_pass http://order_service;
    }

    # /drivers/:driver_id/orders → order-service
    # (regex-locations имеют приоритет над prefix-location /drivers ниже)
    location ~ ^/drivers/[^/]+/orders$ {
        proxy_pass http://order_service;
    }


    # --------------------------------------------------------------------------
    # Resource Service (resource-app:8081)
    #   POST  /drivers                — создание водителя
    #   POST  /drivers/categories     — добавление категории водителю
    #   GET   /drivers/:id            — водитель по ID
    #   GET   /drivers/:id/categories — категории водителя
    #   GET   /drivers                — список водителей (фильтр)
    #   PUT   /drivers/:id/status     — обновление статуса водителя
    #   POST  /autos                  — создание автомобиля
    #   GET   /autos/:id              — автомобиль по ID
    #   GET   /autos                  — список автомобилей (фильтр)
    #   PUT   /autos/:id/status       — обновление статуса автомобиля
    # --------------------------------------------------------------------------

    location /drivers {
        proxy_pass http://resource_service;
    }

    location /autos {
        proxy_pass http://resource_service;
    }


    # --------------------------------------------------------------------------
    # Fallback — всё остальное возвращает 404
    # --------------------------------------------------------------------------

    location / {
        return 404;
    }
}