services:
    rabbitmq:
        image: rabbitmq:4.3-alpine
        hostname: rabbitmq
        ports:
            - "5672:5672"
        networks:
            - backend
        environment:
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: admin
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5    

    db:
        image: postgres:14
        environment:
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=freightmanagementdb
            - POSTGRES_USER=admin
        ports:
            - "5432:5432"
        volumes:
            - ./postgres_data:/var/lib/postgresql/data
            - ./init-scripts:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d freightmanagementdb"]
            interval: 5s      
            timeout: 5s       
            retries: 5        
            start_period: 10s 
                
        networks:
            - backend
    
    user-app:
        build: ./user-service
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - backend
        environment:
            - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
        env_file:
            - .env
        ports:
            - "8080:8080"
            - "50051:50051"
    resource-app:
        build: ./resource-service
        depends_on:
            db:
                condition: service_healthy
        networks:
            - backend
        env_file:
            - .env
        ports:
            - "8081:8081"
    order-app:
        build: ./order-service
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        environment:
            - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
        env_file:
            - .env
        networks:
            - backend
        ports:
            - "8082:8082"
            - "50052:50052"
    auth-app:
        build: ./auth-service
        depends_on:
            db:
                condition: service_healthy
            user-app:
                condition: service_started
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        environment:
            - USER_APP_URL=user-app:50051
        networks:
            - backend
        ports:
            - "8083:8083"
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
    notification-app:
        build: ./notification-service
        depends_on:
            rabbitmq:
                condition: service_healthy
        environment:
            - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
        networks:
            - backend

    frontend:
        build: ./frontend
        depends_on:
            nginx:
                condition: service_started
        ports:
            - "3000:80"
        networks:
            - frontend
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    nginx:
        image: nginx:alpine
        depends_on:
            auth-app:
                condition: service_started
            user-app:
                condition: service_started
            order-app:
                condition: service_started
            resource-app:
                condition: service_started
        ports:
            - "80:80"
        volumes:
            - ./nginx/conf.d:/etc/nginx/conf.d:ro
            - ./nginx/html:/usr/share/nginx/html:ro
        networks:
            - backend
            - frontend
                         
networks:
    backend:
        driver: bridge
    frontend:
        driver: bridge
