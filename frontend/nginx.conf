# ==============================================================================
# Freight Management — Frontend Nginx Configuration
# ==============================================================================
# Отдаёт Vue SPA (статические файлы) и проксирует API-запросы к основному
# nginx API Gateway (контейнер "nginx" в Docker-сети "backend").
#
# Маршрутизация:
#   /api/*  → http://nginx:80/*  (rewrite: убираем префикс /api)
#   /       → Vue SPA (index.html, history mode fallback)
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Максимальный размер тела запроса
    client_max_body_size 10m;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --------------------------------------------------------------------------
    # API Proxy → основной nginx API Gateway
    # --------------------------------------------------------------------------
    # /api/auth/login    → http://nginx:80/auth/login
    # /api/orders        → http://nginx:80/orders
    # /api/drivers       → http://nginx:80/drivers
    # и т.д.
    # --------------------------------------------------------------------------
    location /api/ {
        # Убираем префикс /api и проксируем к API Gateway
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://nginx:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Передача cookie (JWT)
        proxy_pass_request_headers on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # --------------------------------------------------------------------------
    # Статические файлы Vue SPA (Vite build)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Vue Router History Mode — fallback на index.html
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Кэширование favicon
    # --------------------------------------------------------------------------
    location = /favicon.svg {
        expires 30d;
        access_log off;
    }
}